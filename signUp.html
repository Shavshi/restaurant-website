<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signUp</title>
    <link rel="stylesheet" href="signUp.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

</head>

<body>
    <main>
        <div id="toast" class="user-already-exist">
            <button class="toast-close" id="toastClose" type="button">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <i class="fa-solid fa-circle-exclamation toast-icon"></i>
            <div class="toast-content">
                <p class="toast-title" id="toastTitle"></p>
                <p class="toast-text" id="toastText"></p>
            </div>
        </div>

        <form action="index.html" novalidate>
            <div class="top-form">
                <h1>Create Account</h1>
                <p>Join us today</p>
            </div>
            <div class="container-firstName-and-lastName">
                <div class="firstName">
                    <label for="name">First Name</label>
                    <input id="name" type="text" placeholder="John" required>
                </div>

                <div class="lastName">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" type="text" placeholder="Doe" required>
                </div>
            </div>

            <div class="container-email-and-password">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" required>
                <i class="fa-regular fa-eye"></i>
                <i class="fa-regular fa-eye-slash"></i>

                <ul>
                    <li>At least 8 characters</li>
                    <li>Uppercase And lowercase letters</li>
                    <li>At least one number</li>
                    <li>At least one special character</li>
                </ul>
                <p id="passwordError"></p>
            </div>
            <div class="bottom-form-button">
                <button id="createBtn" type="submit">Create Account</button>
                <div class="already-have-an-account">
                    <p id="alreadyHaveAnAccount">Already have an account?</p>
                    <a href="logIn.html">
                        <p id="login">Login</p>
                    </a>
                </div>
            </div>
        </form>
    </main>
    <script type="module" src="signUp.js"></script>
</body>

</html>
