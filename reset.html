<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

</head>

<body>
    <main>
        <div id="toast" class="reset-error">
            <button class="toast-close" id="toastClose" type="button">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <i class="fa-solid fa-circle-exclamation toast-icon"></i>
             
            <div class="toast-content">
                <p class="toast-title" id="toastTitle"></p>
                <p class="toast-text" id="toastText"></p>
            </div>
        </div>
        <form action="">
            <div class="top-form">
                <h1>Reset Password</h1>
                <p>Enter your new password</p>
            </div>
            <div class="middle-form">
                <label for="newPassword">New Password</label>
                <input id="newPassword" type="password" placeholder="••••••••" required>
                <i id="faEye" class="fa-regular fa-eye"></i>
                <i id="faEyeSlash" class="fa-regular fa-eye-slash"></i>

                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" type="password" placeholder="••••••••" required>
            </div>
            <div class="rules-of-password">
                <p>• At least 8 characters</p>
                <p>• Uppercase and lowercase letters</p>
                <p>• At least one number</p>
                <p>• At least one special character</p>
            </div>
            <div id="passwordErorrs">
                <p id="passwordError"></p>
            </div>
            <div class="reset-password">
                <button id="btn" type="submit">Reset Password</button>
            </div>
            <div class="bottom-form">
                <a href="logIn.html">Back to Login</a>
            </div>
        </form>
    </main>

    <script src="reset.js"></script>
</body>

</html>
